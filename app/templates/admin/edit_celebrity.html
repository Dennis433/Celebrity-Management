{% extends 'admin/base.html' %}

{% block title %}Edit {{ celeb.name }} - OCM Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold mb-0">
        <i class="fas fa-edit text-warning me-2"></i>Edit — {{ celeb.name }}
    </h3>
    <a href="{{ url_for('admin.celebrities') }}" class="btn btn-outline-warning rounded-pill px-4">
        <i class="fas fa-arrow-left me-2"></i>Back
    </a>
</div>

<div class="row g-4">
    <div class="col-lg-4 text-center">
        <div class="dash-card rounded-4 p-4">
            {% if celeb.image %}
            <img src="{{ url_for('static', filename=celeb.image) }}"
                 alt="{{ celeb.name }}"
                 class="rounded-circle mb-3"
                 style="width:150px; height:150px; object-fit:cover; border: 3px solid rgba(255,193,7,0.4);">
            {% else %}
            <div class="celeb-avatar mx-auto mb-3" style="width:150px; height:150px; font-size:3rem;">
                <i class="fas fa-user text-warning"></i>
            </div>
            {% endif %}
            <h5 class="fw-bold">{{ celeb.name }}</h5>
            <span class="badge bg-warning text-dark rounded-pill">{{ celeb.category }}</span>

            <!-- Upload Image -->
            <form method="POST"
                  action="{{ url_for('admin.upload_celebrity_image', celeb_id=celeb.id) }}"
                  enctype="multipart/form-data"
                  class="mt-4">
                <div class="mb-3">
                    <input type="file" name="image" accept=".jpg,.jpeg,.png,.webp" class="form-control form-control-sm">
                </div>
                <button type="submit" class="btn btn-warning rounded-pill px-4 fw-bold w-100">
                    <i class="fas fa-upload me-2"></i>Upload Photo
                </button>
            </form>
        </div>
    </div>

    <div class="col-lg-8">
        <div class="dash-card rounded-4 p-4">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Net Worth</label>
                        <input type="text" name="net_worth" class="form-control"
                               placeholder="e.g. $300 Million"
                               value="{{ celeb.net_worth or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nationality</label>
                        <input type="text" name="nationality" class="form-control"
                               placeholder="e.g. American"
                               value="{{ celeb.nationality or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Date of Birth</label>
                        <input type="text" name="born" class="form-control"
                               placeholder="e.g. October 18, 1989"
                               value="{{ celeb.born or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Known For</label>
                        <input type="text" name="known_for" class="form-control"
                               placeholder="e.g. Singing, Acting"
                               value="{{ celeb.known_for or '' }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Biography</label>
                        <textarea name="bio" class="form-control" rows="10"
                                  placeholder="Write a detailed biography...">{{ celeb.bio or '' }}</textarea>
                        <small class="text-muted">Use new lines to separate paragraphs.</small>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-warning rounded-pill px-5 fw-bold">
                            <i class="fas fa-save me-2"></i>Save Changes
                        </button>
                        <a href="{{ url_for('celebrities.detail', celeb_id=celeb.id) }}"
                           class="btn btn-outline-warning rounded-pill px-4 ms-2" target="_blank">
                            <i class="fas fa-eye me-2"></i>Preview
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
